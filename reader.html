<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3">
<!-- 리더 보안 CSP (T12): 제3자 스크립트·서비스워커·인라인 없음, connect 는 API 만 -->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src http://localhost:8799 https://api.hyunhak.com; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<title>현학적 연구소 · 보안 뷰어</title>
<style>
  :root{ --hyun:#312E2E; --paper:#EFE9DC; --ash:#696561; --seal:#BC3529; }
  *{ box-sizing:border-box; margin:0; padding:0;
     -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body{ height:100%; background:#1a1918; color:var(--paper);
    font-family:"KoPubWorld Batang","Apple SD Gothic Neo",sans-serif; overscroll-behavior:none; }
  #bar{ position:fixed; top:0; left:0; right:0; height:52px; z-index:10;
    display:flex; align-items:center; gap:14px; padding:0 16px;
    background:rgba(26,25,24,.94); border-bottom:1px solid #3a3836; }
  #bar .t{ font-size:15px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #bar .who{ font-size:11px; color:var(--ash); }
  button{ font:inherit; font-size:13px; color:var(--paper); background:#2d2b2a;
    border:1px solid #4a4744; border-radius:6px; padding:7px 13px; cursor:pointer; }
  button:hover{ background:#3a3836; } button:disabled{ opacity:.5; cursor:default; }
  #stage{ position:absolute; top:52px; bottom:0; left:0; right:0; overflow-y:auto;
    scroll-behavior:smooth; -webkit-overflow-scrolling:touch; text-align:center; padding:20px 0 60px; }
  .pg{ display:block; margin:0 auto 14px; max-width:min(94vw,900px); width:100%;
    box-shadow:0 2px 18px rgba(0,0,0,.5); background:#2a2826; }
  #msg{ padding:80px 24px; text-align:center; color:var(--ash); line-height:1.7; }
  #msg a{ color:var(--paper); }
  .han{ font-size:.82em; color:var(--ash); }
  #foot{ position:fixed; bottom:0; left:0; right:0; z-index:10; padding:5px 16px;
    font-size:10px; color:var(--ash); background:rgba(26,25,24,.94); border-top:1px solid #3a3836;
    text-align:center; }
  /* 웹 인쇄 억지 (T8): 공식 인쇄 버튼만 허용, ctrl+P 는 빈 안내 */
  @media print{ body *{ display:none !important; }
    body::after{ display:block !important; content:"현학적 연구소 자료는 뷰어의 인쇄 버튼으로만 인쇄할 수 있습니다."; padding:40px; color:#000; } }
  #curtain{ position:fixed; inset:0; z-index:100; background:#111; color:var(--paper);
    display:none; align-items:center; justify-content:center; text-align:center; padding:40px; line-height:1.8; }
</style>
</head>
<body>
<div id="bar">
  <span class="t" id="title">현학적 연구소 보안 뷰어</span>
  <span class="who" id="who"></span>
  <button id="printBtn" hidden>인쇄</button>
</div>
<div id="stage"><div id="msg">불러오는 중…</div></div>
<div id="foot">© 현학적 연구소 <span class="han">玄學的 硏究所</span> · 무단 복제, 전재, 배포 금지</div>
<div id="curtain"></div>
<script src="assets/reader.js"></script>
</body>
</html>
