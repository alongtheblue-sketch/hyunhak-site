<script src="assets/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function(){
  var q = new URLSearchParams(location.search);
  var h = document.getElementById('h'), sub = document.getElementById('sub');
  var lines = document.getElementById('lines'), acts = document.getElementById('acts');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  if (q.get('code') || q.get('fail')) {
    h.innerHTML = '결제가<br>완료되지 않았습니다';
    sub.textContent = q.get('message') || '결제가 중단되었습니다. 장바구니에서 다시 시도하십시오.';
    acts.hidden = false;
    acts.innerHTML = '<a class="act" href="cart.html">장바구니로</a><a class="textlink u" href="index.html">처음으로</a>';
    return;
  }

  var paymentKey = q.get('paymentKey'), orderId = q.get('orderId'), amount = parseInt(q.get('amount'), 10);
  if (!paymentKey || !orderId || !amount) {
    h.innerHTML = '잘못된 접근입니다';
    sub.textContent = '결제 창을 통해서만 열리는 화면입니다.';
    acts.hidden = false; acts.innerHTML = '<a class="act" href="index.html">처음으로</a>';
    return;
  }
  try {
    var r = await HH.api('/api/payments/confirm', { method: 'POST',
      body: JSON.stringify({ paymentKey: paymentKey, orderId: orderId, amount: amount }) });
    try { localStorage.removeItem('hh_cart_v1'); } catch(e) {}
    h.innerHTML = '결제가<br>완료되었습니다';
    sub.textContent = '이용권은 즉시 열리며, 실물 상품은 순차 출고합니다.';
    lines.hidden = false;
    lines.innerHTML = '<div><dt>주문 번호</dt><dd>' + esc(orderId) + '</dd></div>'
      + '<div><dt>결제 금액</dt><dd>' + HH.won(amount) + '</dd></div>'
      + (r.receipt ? '<div><dt>영수증</dt><dd><a class="textlink u" target="_blank" rel="noopener" href="' + esc(r.receipt) + '">보기</a></dd></div>' : '');
    acts.hidden = false;
    acts.innerHTML = '<a class="act" href="my.html">마이페이지</a><a class="textlink u" href="studio.html">면접 스튜디오</a>';
  } catch (e) {
    h.innerHTML = '승인에<br>실패했습니다';
    sub.textContent = e.message || '결제 승인에 실패했습니다. 금액이 빠져나갔다면 자동 취소됩니다.';
    acts.hidden = false;
    acts.innerHTML = '<a class="act" href="cart.html">장바구니로</a><a class="textlink u" href="mailto:admin@hyunhak.com">문의</a>';
  }
});
</script>
