<!-- 행사 팝업 카드 (2026-09-22 무대 통합판. 구 하단 시트 .pdim 뿌리는 app.js 가 만든다). 뿌리는 hidden, app.js 무대가 안의 .pop 만 가운데(.pdim > .pstage)로 옮겨 세운다.
     자리표  {mod} {rate} {label} {until_text} {promo_id} {ends_at} {img} {rows} {notice_line} {p} {link_studio_label} {link_guidebook_label}
             ({mute_label} 은 하단바가 맡아 지면에 안 실린다. apply_promo.py 가 주는 값은 그대로 두고 자리표만 안 쓴다)
     행 형식 {rows} = <tr><th scope="row">이름</th><td><span data-list-price="33000">33,000원</span></td></tr> × N. 지면에는 정가만 적는다(app.js 가 .was 와 .sale 을 만든다).
     ★뿌리에 data-promo 를 달지 마라. app.js renderPromoPrices 가 행사 중이면 hidden 을 false 로 되돌린다.
      세우는 판정은 app.js 무대 몫: /api/config.promo 가 [data-promo-popup] 과 같은 id 로 살아 있을 때만. [data-promo-until] 은 만료 자체 판정용.
     붙는 JS  하단바(닫기 · 오늘 하루 보지 않기 · ←/→ · 정지) 와 ESC · 포커스 트랩 · 포커스 복귀는 app.js openStage 가 준다. [data-ppop-go=studio|guidebook] 은 클릭 계측. -->
<div hidden id="promoPopup" data-hh-popup="promo" data-promo-popup="{promo_id}" data-promo-until="{ends_at}">
  <div class="pop {mod}" role="group" data-ppop-card aria-labelledby="ppopT" aria-describedby="ppopU">
    <div class="pfr">
      <div class="prib"><p class="k">행사 안내</p></div>
      <figure class="pkv"><img src="{img}" alt="" width="1600" height="686"></figure>
      <div class="ptxt">
        <span class="rate">{rate}</span>
        <h2 id="ppopT">{label}</h2>
        <p class="until" id="ppopU">{until_text}</p>
{notice_line}      </div>
      <div class="pbot">
        <table class="ptbl">
          <caption class="sr">{rate} 할인 적용 가격 예시. 정가 뒤에 할인가가 붙습니다.</caption>
          <tbody>{rows}
          </tbody>
        </table>
        <div class="pacts">
          <a class="btn" href="{p}studio.html#plans" data-ppop-go="studio">{link_studio_label} <span class="ar" aria-hidden="true">→</span></a>
          <a class="btn ghost" href="{p}guidebook/index.html" data-ppop-go="guidebook">{link_guidebook_label}</a>
        </div>
      </div>
    </div>
  </div>
</div>
