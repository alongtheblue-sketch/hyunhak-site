<aside class="promo rule" data-promo="{id}" data-promo-until="{until}" aria-label="할인 행사 안내">
  <div class="in wrap">
    <p class="msg"><i class="dot" aria-hidden="true"></i><b>{rate}%</b> <span class="lb">할인</span> <b><span class="lg">{until_y}</span>{until_md}</b> <span class="lb lg">마감</span><span class="sm sans">마감입니다.</span>{price_note}</p>
    <a href="{p}{link}"><span class="lg">{link_label}</span><span class="sm">{link_label_sm}</span><span aria-hidden="true">→</span></a>
  </div>
</aside>
