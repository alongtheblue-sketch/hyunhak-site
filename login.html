<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500;700&display=swap">

<style>
.room{min-height:calc(100vh - 140px);display:grid;grid-template-columns:1fr minmax(360px,520px) 1fr}
.room .side{border-right:1px solid var(--hair);position:relative}
.room .side .seal{position:absolute;right:28px;top:44%}
.room .box{padding:120px 48px 140px}
.room .aftr{border-left:1px solid var(--hair)}
.box .crumb{margin-bottom:20px}
.box h1{font-family:var(--serif);font-weight:700;font-size:var(--t-h1);letter-spacing:-0.03em}
.box .han{margin-top:10px;font-family:var(--serif);font-weight:300;font-size:14px;color:var(--gray)}
.box form{margin-top:56px}
.keep{display:flex;align-items:center;gap:10px;margin:6px 0 40px;font-size:12.5px;color:var(--gray)}
.keep input{appearance:none;width:15px;height:15px;border:1px solid var(--ink);cursor:pointer}
.keep input:checked{background:var(--ink)}
.entry{display:flex;align-items:center;gap:26px}
.aux2{margin-top:46px;padding-top:22px;border-top:1px solid var(--hairs);
  display:flex;gap:28px}
@media (max-width:900px){
  .room{grid-template-columns:0 1fr 0}
  .room .side,.room .aftr{display:none}
  .room .box{padding:80px var(--gut) 100px}
}



/* ── 반전 판 색 승계 (페이지 인라인이 base.css 보다 후순위라 여기서 재선언) ── */
.invert .gray,.invert .k,.invert .per,.invert .note,.invert .help,.invert .d,.invert .m,
.invert .s,.invert .c,.invert .lead,.invert .member,.invert .crumb,
.invert .inc li>span:first-child,.invert .spec .k,.invert dt{color:rgba(246,242,233,.66)!important}
.invert p,.invert li,.invert span,.invert dd,.invert .v,
.invert .inc li>span:last-child{color:rgba(246,242,233,.9)!important}
.invert h1,.invert h2,.invert h3,.invert .t,.invert .won,.invert .price,.invert b,
.invert .ttl{color:var(--paper)!important}
.invert .seal{background:var(--seal)!important}
.invert li,.invert .rows li,.invert .inc li{border-color:rgba(246,242,233,.16)!important}
.invert .textlink{color:var(--paper)!important;border-bottom-color:rgba(246,242,233,.5)!important}
.invert .act{background:var(--paper)!important;color:var(--ink)!important;border-color:var(--paper)!important}
.invert .act:hover{background:transparent!important;color:var(--paper)!important}
.invert .act.ghost{background:transparent!important;color:var(--paper)!important;border-color:rgba(246,242,233,.55)!important}
.invert .act.ghost:hover{background:var(--paper)!important;color:var(--ink)!important}
</style>
</head>
<body>

<header class="nav u">
  <a class="brand" href="index.html">현학적 연구소</a>
  <nav>
    <a href="studio.html">면접 스튜디오</a>
    <a href="store.html">스토어</a>
    <a href="interview/index.html">면접 아카이브</a>
    <a href="library.html">자료실</a>
    <a href="index.html#lab">연구소</a>
  </nav>
  <div class="aux">
    <a class="on" href="login.html">로그인</a>
    <a href="join.html">가입</a>
    <a href="cart.html">장바구니 2</a>
  </div>
</header>

<main class="room">
  <div class="side" aria-hidden="true"><span class="seal seal-dot"></span></div>
  <div class="box">
    <p class="crumb u gray">현학적 연구소, 로그인</p>
    <h1>로그인</h1>
    <p class="han">구매한 지문은 로그인 후에 열람합니다</p>
    <form id="loginForm">
      <div class="field">
        <label for="em">이메일</label>
        <input id="em" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="pw">비밀번호</label>
        <input id="pw" type="password" autocomplete="current-password" required>
      </div>
      <label class="keep"><input type="checkbox" checked> 이 기기에서 로그인 유지</label>
      <div class="entry">
        <button class="act" type="submit" id="loginBtn">로그인</button>
        <a class="textlink u" href="mailto:admin@hyunhak.com?subject=비밀번호 재설정 요청">비밀번호 재설정 문의</a>
      </div>
    </form>
    <script>
    document.addEventListener('DOMContentLoaded', function(){
      document.getElementById('loginForm').addEventListener('submit', async function(ev){
        ev.preventDefault();
        var btn=document.getElementById('loginBtn'); btn.disabled=true; btn.textContent='확인 중…';
        try{
          await HH.api('/api/auth/login',{method:'POST',body:JSON.stringify({
            email:document.getElementById('em').value.trim(),
            password:document.getElementById('pw').value})});
          location.href=new URLSearchParams(location.search).get('next')||'my.html';
        }catch(e){ alert(e.message||'로그인에 실패했습니다'); btn.disabled=false; btn.textContent='로그인'; }
      });
    });
    </script>
    <div class="aux2 u">
      <span class="gray">처음이라면</span>
      <a class="textlink" href="join.html">세 걸음의 가입</a>
    </div>
  </div>
  <div class="aftr" aria-hidden="true"></div>
</main>

<footer class="u">
  <span>현학적 연구소 <span class="han">玄學的 硏究所</span></span>
  <span>www.hyunhak.com</span>
  <span class="bizline">대표 · 사업자등록번호 · 통신판매업신고 [정식 오픈 전 기재] · 서울, 대한민국 · admin@hyunhak.com · <a href="terms.html" style="border-bottom:1px solid var(--hair)">이용약관</a> · <a href="privacy.html" style="border-bottom:1px solid var(--hair)">개인정보처리방침</a></span>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
