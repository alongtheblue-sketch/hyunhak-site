  <h1>공지</h1>
  <p class="han">가이드북 갱신, 스튜디오 일정, 서비스 안내</p>

  <!-- aeo --><p class="aeo-answer">현학적 연구소 공지는 가이드북 갱신, 스튜디오 일정, 서비스 변경 사항을 날짜순으로 기록합니다.</p><!-- /aeo -->

<div id="list"><ul class="rows"></ul><p class="empty" hidden>등록된 공지가 없습니다.</p></div>
<article id="view" hidden>
  <h2 id="vTitle"></h2>
  <p class="meta" id="vMeta"></p>
  <div class="body" id="vBody"></div>
  <p class="back"><a class="textlink" href="notice.html">목록으로</a></p>
</article>
<script>
(function(){
  const fmt = (iso) => iso ? iso.slice(0,10).replace(/-/g,'.') : '';
  const id = new URLSearchParams(location.search).get('id');
  async function list(){
    let data; try{ data = await HH.api('/api/notices?kind=notice&limit=50'); }catch(e){ data = {items:[]}; }
    const items = Array.isArray(data) ? data : (data.notices || data.items || []);
    const ul = document.querySelector('#list .rows');
    if(!items.length){ document.querySelector('#list .empty').hidden = false; return; }
    ul.innerHTML = items.map(it => '<li><a href="notice.html?id=' + encodeURIComponent(it.id) + '">'
      + '<span class="d">' + fmt(it.starts_at || it.created_at) + '</span>'
      + '<span class="t">' + HH.esc(it.title) + '</span>'
      + '<span class="pin">' + (it.pinned ? '고정' : '') + '</span></a></li>').join('');
  }
  async function view(){
    let it; try{ it = await HH.api('/api/notices/' + encodeURIComponent(id)); }catch(e){ location.replace('notice.html'); return; }
    it = it.notice || it.item || it;
    document.getElementById('list').hidden = true;
    const v = document.getElementById('view'); v.hidden = false;
    document.getElementById('vTitle').textContent = it.title;
    document.getElementById('vMeta').textContent = fmt(it.starts_at || it.created_at) + (it.pinned ? '  고정 공지' : '');
    document.getElementById('vBody').innerHTML = it.body_html || ('<p>' + HH.esc(it.body_md || '') + '</p>');
    document.title = it.title + ', 현학적 연구소 공지';
  }
  document.addEventListener('DOMContentLoaded', id ? view : list);
})();
</script>
